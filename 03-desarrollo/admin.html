<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel administrativo | Café Claro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="portal-page admin-page">
    <header class="site-header">
        <a class="brand" href="index.html">
            <span class="brand-mark">✳</span>
            <span>café <b>claro</b></span>
        </a>
        <nav class="portal-nav">
            <a href="index.html">Página principal</a>
            <button id="logout">Cerrar sesión</button>
        </nav>
    </header>
    <main class="admin-main">
        <div class="section-heading">
            <div>
                <p class="eyebrow">
                    <span class="line"></span> Panel administrativo
                </p>
                <h1>Lo importante<br><em>en un vistazo.</em></h1>
            </div>
            <p class="section-intro">Usuarios, productos, inventario y pedidos registrados en el sistema.</p>
        </div>
        <div class="admin-stats" id="stats"></div>
        <section class="admin-panel">
            <div>
                <h2>Productos e inventario</h2>
                <form class="admin-form" id="product-form">
                    <input type="hidden" id="product-id">
                    <input id="product-name" placeholder="Nombre" required>
                    <textarea id="product-description" placeholder="Descripción" required></textarea>
                    <input id="product-category" type="number" min="1" placeholder="ID categoría" required>
                    <input id="product-price" type="number" min="0" step="0.01" placeholder="Precio" required>
                    <input id("product-stock" type("number" min("0" placeholder("Existencias" required)
                    <input id("product-minimum" type("number" min("0" value("5" placeholder("Stock mínimo" required)
                    <button class("button primary" type("submit">Guardar producto</button>
                </form>
            </div>
            <div>
                <div class("admin-table-head"):
                    <h2>Catálogo</h2>
                    <span id("product-status"></span>
                </div>
                <div id("products"></div>
            </div>
        </section>
        <section class("admin-panel"):
            <div class("admin-table-head"):
                <h2>Últimos pedidos</h2>
                <span id("order-status"></span>
            </div>
            <div id("orders"></div>
        </section]
    </main]
    <script src("admin.js"></script]
</body]
</html]
